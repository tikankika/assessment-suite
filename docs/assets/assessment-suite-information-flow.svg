<svg xmlns="http://www.w3.org/2000/svg" width="690" height="428" viewBox="0 0 690 428" role="img" aria-labelledby="flow-title flow-desc">
<title id="flow-title">Assessment Suite: information flow and return to earlier records</title>
<desc id="flow-desc">Six steps run downwards, with explanations on the right. Criteria design and assessment introduce judgements. Compilation reorganises recorded assessments. Later work introduces further interpretation. A dashed return arrow from compilation to assessment represents retrieving an earlier record for review, not automatic revision.</desc>
<rect x="0" y="0" width="690" height="428" fill="#ffffff"/>
<rect x="28" y="8" width="190" height="58" rx="5" fill="#EDF5F4"/>
<text x="39" y="41" font-family="Arial" font-size="14.6" font-weight="bold" fill="#17333E">1. Prepare materials</text>
<text x="243" y="32" font-family="Arial" font-size="14.2" fill="rgb(37,56,65)">Questions, student answers and assessment materials</text>
<text x="243" y="50" font-family="Arial" font-size="14.2" fill="rgb(37,56,65)">are converted and organised for use.</text>
<line x1="123" y1="68" x2="123" y2="75" stroke="#126B72" stroke-width="1.2"/>
<polyline points="119,72 123,76 127,72" fill="none" stroke="#126B72" stroke-width="1.2"/>
<rect x="28" y="78" width="190" height="58" rx="5" fill="#FCF3E4"/>
<text x="39" y="111" font-family="Arial" font-size="14.6" font-weight="bold" fill="#17333E">2. Define criteria</text>
<text x="243" y="93" font-family="Arial" font-size="14.2" fill="rgb(37,56,65)">The teacher and AI develop or review the rubric:</text>
<text x="243" y="111" font-family="Arial" font-size="14.2" fill="rgb(37,56,65)">the aspects and quality descriptions to use.</text>
<text x="243" y="129" font-family="Arial" font-size="13" fill="#6B562F">Phase 4: choices about what will count</text>
<line x1="123" y1="138" x2="123" y2="145" stroke="#126B72" stroke-width="1.2"/>
<polyline points="119,142 123,146 127,142" fill="none" stroke="#126B72" stroke-width="1.2"/>
<rect x="28" y="148" width="190" height="58" rx="5" fill="#EDF5F4"/>
<text x="39" y="181" font-family="Arial" font-size="14.6" font-weight="bold" fill="#17333E">3. Gather answers</text>
<text x="243" y="172" font-family="Arial" font-size="14.2" fill="rgb(37,56,65)">Answers are grouped by question, ready for the</text>
<text x="243" y="190" font-family="Arial" font-size="14.2" fill="rgb(37,56,65)">teacher to work across the class.</text>
<line x1="123" y1="208" x2="123" y2="215" stroke="#126B72" stroke-width="1.2"/>
<polyline points="119,212 123,216 127,212" fill="none" stroke="#126B72" stroke-width="1.2"/>
<rect x="28" y="218" width="190" height="58" rx="5" fill="#FCF3E4"/>
<text x="39" y="251" font-family="Arial" font-size="14.6" font-weight="bold" fill="#17333E">4. Assess and discuss</text>
<text x="243" y="233" font-family="Arial" font-size="14.2" fill="rgb(37,56,65)">The AI proposes judgements, reasons and points.</text>
<text x="243" y="251" font-family="Arial" font-size="14.2" fill="rgb(37,56,65)">The teacher can discuss changes before saving.</text>
<text x="243" y="269" font-family="Arial" font-size="13" fill="#6B562F">Phase 6: a new assessment judgement</text>
<line x1="123" y1="278" x2="123" y2="285" stroke="#126B72" stroke-width="1.2"/>
<polyline points="119,282 123,286 127,282" fill="none" stroke="#126B72" stroke-width="1.2"/>
<rect x="28" y="288" width="190" height="58" rx="5" fill="#EDF5F4"/>
<text x="39" y="312" font-family="Arial" font-size="14.6" font-weight="bold" fill="#17333E">5. Bring records</text>
<text x="39" y="330" font-family="Arial" font-size="14.6" font-weight="bold" fill="#17333E">together</text>
<text x="243" y="312" font-family="Arial" font-size="14.2" fill="rgb(37,56,65)">Saved assessments are compiled by student,</text>
<text x="243" y="330" font-family="Arial" font-size="14.2" fill="rgb(37,56,65)">with numerical summaries and access to detail.</text>
<line x1="123" y1="348" x2="123" y2="355" stroke="#126B72" stroke-width="1.2"/>
<polyline points="119,352 123,356 127,352" fill="none" stroke="#126B72" stroke-width="1.2"/>
<rect x="28" y="358" width="190" height="58" rx="5" fill="#FCF3E4"/>
<text x="39" y="382" font-family="Arial" font-size="14.6" font-weight="bold" fill="#17333E">6. Interpret and</text>
<text x="39" y="400" font-family="Arial" font-size="14.6" font-weight="bold" fill="#17333E">communicate</text>
<text x="243" y="373" font-family="Arial" font-size="14.2" fill="rgb(37,56,65)">The AI proposes patterns, criterion-related claims</text>
<text x="243" y="391" font-family="Arial" font-size="14.2" fill="rgb(37,56,65)">or feedback for the teacher to examine.</text>
<text x="243" y="409" font-family="Arial" font-size="13" fill="#6B562F">Later stages: further interpretation</text>
<polyline points="28,317 9,317 9,247 25,247" fill="none" stroke="#126B72" stroke-width="1.3" stroke-dasharray="4 3"/>
<polygon points="28,247 22,243 22,251" fill="#126B72"/>
</svg>
